<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODANOVA - Catalogue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/catalogue.css">
    <link rel="icon" type="image/png" href="photo/logo.png">
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg custom-navbar py-3" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand fw-bold tracking-wide" href="index.html">MODANOVA</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto ms-4">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link active fw-bold" href="catalogue_2.html" aria-current="page">Catalogue</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            </ul>
            <div class="nav-icons d-flex align-items-center gap-3">
                <a href="#" class="nav-icon" title="Profile">
                    <img src="photo/user.png" alt="User profile">
                </a>
                <a href="#" class="nav-icon" title="Cart">
                    <img src="photo/basket.png" alt="Basket">
                </a>
            </div>
        </div>
    </div>
</nav>

<main class="flex-grow-1 container my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <h1 class="h3 mb-0">Catalogue</h1>
        <form class="input-group shop-search" id="search-form" action="catalogue_2.html" method="get" role="search">
            <input type="search" id="search-input" name="q" class="form-control" placeholder="Search products" aria-label="Search products">
            <button class="btn btn-dark" type="submit">Search</button>
        </form>
        <select id="sort-select" class="form-select sort-select" aria-label="Sort products">
            <option value="default">Sort: default</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
        </select>
    </div>

    <!-- Buttons are created by js/catalogue.js from the API categories -->
    <div class="category-filter mb-4" id="category-filter"></div>

    <section class="product-grid" id="product-grid" aria-label="Products"></section>
</main>

<footer class="site-footer text-center py-3">
    <p class="mb-0">© 2026 MODANOVA. All rights reserved. Designed for everyday comfort.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/catalogue.js"></script>
</body>
</html>
